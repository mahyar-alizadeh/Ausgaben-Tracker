<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ausgaben-Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginview" class="login">
  <section class="panel">
    <h2>Anmelden</h2>
    <form id="loginform" novalidate>
      <label for="email">Benutzername oder E-Mail</label>
      <input id="email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="primary" type="submit">Anmelden</button>
      <div class="err" id="loginerr" role="alert"></div>
    </form>
  </section>
</div>
<main id="app" hidden>
  <div class="top">
    <div>
      <h1 id="mlabel">Ausgaben</h1>
      <p class="total"><small>CHF</small><span id="total">0.00</span></p>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Vorheriger Monat">&larr;</button>
      <input type="month" id="month" aria-label="Monat wählen">
      <button id="next" aria-label="Nächster Monat">&rarr;</button>
      <span class="user" id="username"></span>
      <button class="ghost" id="logout" type="button">Abmelden</button>
    </div>
  </div>

  <div class="err" id="dataerr" role="alert"></div>

  <div class="grid">
    <div class="stack">
      <section class="panel">
        <h2>Ausgabe erfassen</h2>
        <form id="f" novalidate>
          <label for="amt">Betrag (CHF)</label>
          <input id="amt" type="number" step="0.05" min="0.05" inputmode="decimal" placeholder="z. B. 24.90">
          <label for="date">Datum</label>
          <input id="date" type="date">
          <label for="cat">Kategorie</label>
          <select id="cat"></select>
          <label for="note">Notiz (optional)</label>
          <input id="note" type="text" maxlength="60">
          <button class="primary" type="submit">Ausgabe speichern</button>
          <div class="err" id="err" role="alert"></div>
        </form>
      </section>
      <section class="panel">
        <h2>Kategorien</h2>
        <div class="row">
          <input id="newcat" type="text" maxlength="30" placeholder="Neue Kategorie, z. B. Hobby" aria-label="Name der neuen Kategorie">
          <button id="addcat" type="button">Hinzufügen</button>
        </div>
        <button id="opencats" class="wide mt" type="button">Kategorien auswählen und löschen</button>
        <p class="empty reset-row"><button class="ghost" id="reset" type="button">Alle Daten löschen</button></p>
      </section>
    </div>

    <div class="stack">
      <section class="panel">
        <div class="charts">
          <div><h2>Verteilung im gewählten Monat</h2><div class="cv"><canvas id="c1" role="img" aria-label="Kreisdiagramm der Ausgaben nach Kategorie"></canvas></div></div>
          <div><h2>Verteilung der letzten 6 Monate</h2><div class="cv"><canvas id="c2" role="img" aria-label="Balkendiagramm der Monatsausgaben"></canvas></div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Summen pro Kategorie</h2>
        <div class="scroll"><table><thead><tr><th>Kategorie</th><th class="n">Anzahl</th><th class="n">CHF</th><th class="n">Anteil</th></tr></thead><tbody id="sum"></tbody></table></div>
      </section>
    </div>
  </div>

  <section class="panel entries">
    <h2>Einträge im gewählten Monat</h2>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Kategorie</th><th>Notiz</th><th class="n">CHF</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
  </section>
</main>

<dialog id="catdlg" aria-labelledby="catdlgt">
  <h2 id="catdlgt">Kategorien auswählen und löschen</h2>
  <div id="catlist" class="catlist"></div>
  <div class="err" id="caterr" role="alert"></div>
  <div class="dlgbtns"><button id="catclose" type="button">Schliessen</button><button id="delcat" type="button" class="danger">Ausgewählte löschen</button></div>
</dialog>
<dialog id="confdlg" aria-labelledby="conft">
  <h2 id="conft">Sind Sie sicher?</h2>
  <p id="conftext"></p>
  <div class="dlgbtns"><button id="confno" type="button">Abbrechen</button><button id="confyes" type="button" class="danger">Ja, löschen</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
