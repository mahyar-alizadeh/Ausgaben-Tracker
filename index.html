<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ausgaben-Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Anmeldung -->
<div id="anmeldeansicht" class="anmeldung">
  <section class="karte">
    <h2>Anmelden</h2>
    <form id="anmeldeformular" novalidate>
      <label for="benutzer">Benutzername oder E-Mail</label>
      <input id="benutzer" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="passwort">Passwort</label>
      <input id="passwort" type="password" autocomplete="current-password">
      <button class="hauptknopf" type="submit">Anmelden</button>
      <div class="fehler" id="anmeldefehler" role="alert"></div>
    </form>
  </section>
</div>

<!-- Anwendung -->
<main id="anwendung" hidden>
  <div class="kopf">
    <div>
      <h1 id="monatstitel">Ausgaben</h1>
      <p class="gesamtbetrag"><small>CHF</small><span id="gesamtsumme">0.00</span></p>
    </div>
    <div class="navigation">
      <button id="zurueck" aria-label="Vorheriger Monat">&larr;</button>
      <input type="month" id="monatswahl" aria-label="Monat wählen">
      <button id="vor" aria-label="Nächster Monat">&rarr;</button>
      <span class="benutzername" id="angemeldetAls"></span>
      <button class="unauffaellig" id="abmelden" type="button">Abmelden</button>
    </div>
  </div>

  <div class="fehler" id="datenfehler" role="alert"></div>

  <div class="raster">
    <div class="spalte">
      <section class="karte">
        <h2>Ausgabe erfassen</h2>
        <form id="erfassungsformular" novalidate>
          <label for="betrag">Betrag (CHF)</label>
          <input id="betrag" type="number" step="0.05" min="0.05" inputmode="decimal" placeholder="z. B. 24.90">
          <label for="datum">Datum</label>
          <input id="datum" type="date">
          <label for="kategorie">Kategorie</label>
          <select id="kategorie"></select>
          <label for="notiz">Notiz (optional)</label>
          <input id="notiz" type="text" maxlength="60">
          <button class="hauptknopf" type="submit">Ausgabe speichern</button>
          <div class="fehler" id="formularfehler" role="alert"></div>
        </form>
      </section>
      <section class="karte">
        <h2>Kategorien</h2>
        <div class="zeile">
          <input id="neueKategorie" type="text" maxlength="30" placeholder="Neue Kategorie, z. B. Hobby" aria-label="Name der neuen Kategorie">
          <button id="kategorieHinzufuegen" type="button">Hinzufügen</button>
        </div>
        <button id="kategorienOeffnen" class="breit abstand" type="button">Kategorien auswählen und löschen</button>
      </section>
    </div>

    <div class="spalte">
      <section class="karte">
        <div class="diagramme">
          <div><h2>Verteilung im gewählten Monat</h2><div class="diagrammfeld"><canvas id="kreisdiagramm" role="img" aria-label="Kreisdiagramm der Ausgaben nach Kategorie"></canvas></div></div>
          <div><h2>Verteilung der letzten 6 Monate</h2><div class="diagrammfeld"><canvas id="balkendiagramm" role="img" aria-label="Balkendiagramm der Monatsausgaben"></canvas></div></div>
        </div>
      </section>
      <section class="karte">
        <h2>Summen pro Kategorie</h2>
        <div class="scrollbereich"><table><thead><tr><th>Kategorie</th><th class="zahl">Anzahl</th><th class="zahl">CHF</th><th class="zahl">Anteil</th></tr></thead><tbody id="summentabelle"></tbody></table></div>
      </section>
    </div>
  </div>

  <section class="karte eintraege">
    <h2>Einträge im gewählten Monat</h2>
    <div class="scrollbereich"><table><thead><tr><th>Datum</th><th>Kategorie</th><th>Notiz</th><th class="zahl">CHF</th><th></th></tr></thead><tbody id="eintragstabelle"></tbody></table></div>
  </section>
</main>

<!-- Fenster: Kategorien löschen -->
<dialog id="kategorienDialog" aria-labelledby="kategorienDialogTitel">
  <h2 id="kategorienDialogTitel">Kategorien auswählen und löschen</h2>
  <div id="kategorienAuswahl" class="kategorienliste"></div>
  <div class="fehler" id="kategorienFehler" role="alert"></div>
  <div class="dialogknoepfe"><button id="kategorienSchliessen" type="button">Schliessen</button><button id="kategorienLoeschen" type="button" class="gefahr">Ausgewählte löschen</button></div>
</dialog>

<!-- Fenster: Sind Sie sicher? -->
<dialog id="bestaetigungDialog" aria-labelledby="bestaetigungTitel">
  <h2 id="bestaetigungTitel">Sind Sie sicher?</h2>
  <p id="bestaetigungText"></p>
  <div class="dialogknoepfe"><button id="bestaetigungNein" type="button">Abbrechen</button><button id="bestaetigungJa" type="button" class="gefahr">Ja, löschen</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
